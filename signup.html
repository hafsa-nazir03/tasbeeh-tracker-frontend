<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <title>Sign Up | Tasbeeh Tracker</title>
    <meta name="description" content="Create a Tasbeeh Tracker account to manage and track your daily dhikr.">
    <link rel="icon" type="images/png" href="images/Signup.png"  alt="Tasbeeh SignUp logo">
</head>
<body>
    <h1>Create Your Account</h1>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <form class="signUp-form">
        <div class="form-group">
        <label for="name">Name</label>
        <input class="name" id="name" type="text" placeholder="Enter your name" required>
        </div>
         <div class="form-group">
        <label for="email">Email Address</label>
        <input class="email" id="email" type="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
        <label for="password">Password</label>
        <input class="password" id="password" type="password" placeholder="Enter your password" required>
        </div>

        <button class="SignUp-button">Sign Up</button>
         </form>
         <a href="index.html">Back</a>
         <script src="config.js"></script>
        <script type="module" src="signup.js"></script>
</body>
</html>
